<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>KSC MetaVerse</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%2314131a'/%3E%3Crect x='4' y='2' width='8' height='3' fill='%235b4436'/%3E%3Crect x='3' y='3' width='1' height='4' fill='%235b4436'/%3E%3Crect x='12' y='3' width='1' height='4' fill='%235b4436'/%3E%3Crect x='3' y='5' width='10' height='5' fill='%23f4cda6'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%233a3038'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%233a3038'/%3E%3Crect x='4' y='10' width='8' height='4' fill='%236ea8dc'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="stage">
        <div id="game-root" class="stage__canvas"></div>

        <div class="chat" id="chat" hidden>
          <div class="chat__log" id="chat-log" role="log" aria-live="polite" aria-label="채팅 기록">
            <p class="chat__empty" id="chat-empty">
              <svg class="chat__empty-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2.5 2.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6l-3.5 3v-3h-.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              아직 대화가 없습니다. Enter 키를 눌러 말을 걸어보세요.
            </p>
          </div>
          <label class="chat__label" for="chat-input">채팅 입력</label>
          <input
            id="chat-input"
            class="chat__input"
            type="text"
            autocomplete="off"
            placeholder="Enter 키로 입력, Esc 로 취소"
          />
        </div>

        <!--
          Vitals: health, and the key that spends it. Top-left, the one corner the chat log, the
          HUD column and the centred notice all leave free.

          Hidden until this room has shown its first monster — a health bar in the plaza promises a
          fight that room does not have, and "which rooms have monsters" is the server's fact
          rather than a table this bundle keeps. playerVitals.ts reveals it.
        -->
        <div class="vitals" id="vitals" data-level="ok" hidden>
          <p class="vitals__head">
            <span class="vitals__label">체력</span>
            <span class="vitals__count" id="vitals-count">30 / 30</span>
          </p>
          <div
            class="vitals__track"
            id="vitals-track"
            role="progressbar"
            aria-label="체력"
            aria-valuemin="0"
            aria-valuemax="30"
            aria-valuenow="30"
          >
            <span class="vitals__fill" id="vitals-fill"></span>
          </div>
          <p class="vitals__hint"><kbd class="vitals__key">Space</kbd> 공격</p>
          <!--
            Cooldown mirror, not a guard: the server owns ATTACK_COOLDOWN_MS. Decorative, so it is
            hidden from the accessibility tree — the swing itself is the feedback that matters.
          -->
          <span class="vitals__cooldown" aria-hidden="true">
            <span class="vitals__cooldown-fill" id="vitals-cooldown"></span>
          </span>
        </div>

        <!--
          Drop notices. Bottom-right, clear of the chat log and of the HUD column, and a live
          region so a pickup is announced and not only drawn. Click-through: a toast that ate a
          click meant for the world would be worse than one you cannot dismiss.
        -->
        <ul class="toasts" id="item-toasts" role="status" aria-live="polite"></ul>

        <!--
          One top-right cluster: the controls row, and the minimap and the bag unfolding under it.
          Before #transition so the wipe, the notice and the boot overlay all draw over it. The
          wrapper is click-through; only the controls take pointer events, or its empty area would
          eat clicks meant for the world.
        -->
        <div class="hud">
          <div class="hud__controls">
            <button
              type="button"
              class="hud__button"
              id="home-button"
              aria-keyshortcuts="H Home"
              title="홈으로 (H)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2.5 7.2 8 2.6l5.5 4.6M4 8.4v4.6h8V8.4M6.6 13v-3.1h2.8V13"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              홈으로
            </button>
            <button
              type="button"
              class="hud__button hud__button--square"
              id="minimap-button"
              aria-expanded="false"
              aria-controls="minimap"
              aria-keyshortcuts="M"
              title="미니맵 (M)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M6 3 2.5 4.4v8.2L6 11.2m0-8.2 4 1.6m-4-1.6v8.2m4-6.6 3.5-1.4v8.2L10 11.2m0-8.2v8.2m-4 0 4 1.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="visually-hidden">미니맵</span>
            </button>
            <button
              type="button"
              class="hud__button hud__button--square"
              id="inventory-button"
              aria-expanded="false"
              aria-controls="inventory"
              aria-keyshortcuts="I"
              title="가방 (I)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2.8 5.8h10.4l-.8 7.1a1 1 0 0 1-1 .9H4.6a1 1 0 0 1-1-.9l-.8-7.1Zm3.2 0V4.4a2 2 0 0 1 4 0v1.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="visually-hidden">가방</span>
            </button>
            <button
              type="button"
              class="hud__button hud__button--square"
              id="loot-table-button"
              aria-expanded="false"
              aria-controls="loot-table"
              aria-keyshortcuts="L"
              title="확률표 (L)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M3 2.6h10v10.8H3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linejoin="round"
                />
                <path
                  d="M3 6.4h10M6.4 6.4v7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.1"
                  stroke-linecap="round"
                />
              </svg>
              <span class="visually-hidden">확률표</span>
            </button>
          </div>
          <div class="minimap" id="minimap" hidden>
            <canvas class="minimap__canvas" id="minimap-canvas" role="img" aria-label="미니맵"></canvas>
          </div>

          <!--
            The bag. In the HUD column rather than behind a scrim like #object-panel, because it
            must not lock movement: checking your bag mid-fight cannot be what pins you in place
            (docs/design-hunting-inventory.md §3.4).
          -->
          <div class="bag" id="inventory" hidden>
            <div class="bag__header">
              <h2 class="bag__title" id="inventory-title">가방</h2>
              <button type="button" class="bag__close" id="inventory-close" title="닫기 (Esc)">
                <svg class="bag__close-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    d="M5 5l6 6M11 5l-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="visually-hidden">가방 닫기</span>
              </button>
            </div>
            <ul class="bag__list" id="inventory-list" aria-labelledby="inventory-title" hidden></ul>
            <!--
              Carries loading, empty and failure in one block, because exactly one of them is on
              screen at a time and role="status" then announces whichever it is.
            -->
            <div class="bag__status" id="inventory-status" role="status" hidden>
              <svg class="bag__status-icon" id="inventory-status-icon" viewBox="0 0 16 16" aria-hidden="true" hidden>
                <path
                  d="M2.8 5.8h10.4l-.8 7.1a1 1 0 0 1-1 .9H4.6a1 1 0 0 1-1-.9l-.8-7.1Zm3.2 0V4.4a2 2 0 0 1 4 0v1.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <p class="bag__status-text" id="inventory-status-text"></p>
              <p class="bag__status-hint" id="inventory-status-hint"></p>
              <button type="button" class="bag__retry" id="inventory-retry" hidden>다시 시도</button>
            </div>
          </div>

          <!--
            The drop-table window. Same HUD-column placement and non-modal treatment as .bag
            (docs/design-hunting-inventory.md §G-2-b) — checking odds must not lock movement any
            more than checking the bag does.
          -->
          <div class="loot-table" id="loot-table" hidden>
            <div class="loot-table__header">
              <h2 class="loot-table__title" id="loot-table-title">확률표</h2>
              <button type="button" class="loot-table__close" id="loot-table-close" title="닫기 (Esc)">
                <svg class="loot-table__close-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path
                    d="M5 5l6 6M11 5l-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="visually-hidden">확률표 닫기</span>
              </button>
            </div>
            <ul class="loot-table__list" id="loot-table-list" aria-labelledby="loot-table-title" hidden></ul>
            <div class="loot-table__status" id="loot-table-status" role="status" hidden>
              <svg class="loot-table__status-icon" id="loot-table-status-icon" viewBox="0 0 16 16" aria-hidden="true" hidden>
                <path
                  d="M3 2.6h10v10.8H3z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              <p class="loot-table__status-text" id="loot-table-status-text"></p>
              <p class="loot-table__status-hint" id="loot-table-status-hint"></p>
              <button type="button" class="loot-table__retry" id="loot-table-retry" hidden>다시 시도</button>
            </div>
          </div>
        </div>

        <!--
          One panel for all three fixed object types; objectPanel.ts fills the body and the footer
          per kind, since only those two differ and two of them never open at once. Before
          #transition and #boot-status like the HUD, so the wipe and the boot overlay always draw
          over it — a dropped connection must not leave a quiz sitting above "연결이 끊어졌습니다".
        -->
        <div id="object-panel" class="object" hidden>
          <div
            class="object__panel"
            id="object-panel-dialog"
            role="dialog"
            aria-labelledby="object-panel-title"
            tabindex="-1"
          >
            <p class="object__kind" id="object-panel-kind"></p>
            <h2 class="object__title" id="object-panel-title"></h2>
            <div class="object__body" id="object-panel-body"></div>
            <div class="object__footer">
              <a
                class="object__open"
                id="object-panel-link"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >
                새 탭에서 열기
              </a>
              <button type="button" class="object__close" id="object-panel-close">닫기</button>
            </div>
          </div>
        </div>

        <!-- Before #boot-status so a boot error raised during the new room's load stays visible. -->
        <div id="transition" class="transition" data-state="clear" aria-hidden="true"></div>
        <p id="transition-notice" class="notice" role="status" aria-live="polite" hidden></p>

        <!-- Character select. Runs once, before the first join, and never comes back. -->
        <div id="avatar-picker" class="picker" hidden>
          <div
            class="picker__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="avatar-picker-title"
          >
            <h1 class="picker__title" id="avatar-picker-title">캐릭터 고르기</h1>
            <p class="picker__hint">방향키로 고르고 Enter 키로 시작합니다.</p>
            <div
              class="picker__grid"
              id="avatar-picker-grid"
              role="radiogroup"
              aria-labelledby="avatar-picker-title"
            ></div>
            <button type="button" class="picker__start" id="avatar-picker-start">
              이 캐릭터로 시작
            </button>
          </div>
        </div>

        <div id="boot-status" class="boot" data-state="loading" role="status" aria-live="polite">
          <span class="boot__spinner" aria-hidden="true"></span>
          <p class="boot__title" data-boot-title>화면을 준비하는 중</p>
          <p class="boot__detail" data-boot-detail>잠시만 기다려 주세요.</p>
          <button type="button" class="boot__retry" data-boot-retry>다시 시도</button>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
