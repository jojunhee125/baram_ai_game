<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>ZEP_test</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' rx='3' fill='%2314131a'/%3E%3Crect x='4' y='2' width='8' height='3' fill='%235b4436'/%3E%3Crect x='3' y='3' width='1' height='4' fill='%235b4436'/%3E%3Crect x='12' y='3' width='1' height='4' fill='%235b4436'/%3E%3Crect x='3' y='5' width='10' height='5' fill='%23f4cda6'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%233a3038'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%233a3038'/%3E%3Crect x='4' y='10' width='8' height='4' fill='%236ea8dc'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="stage">
        <div id="game-root" class="stage__canvas"></div>

        <div class="chat" id="chat" hidden>
          <div class="chat__log" id="chat-log" role="log" aria-live="polite" aria-label="채팅 기록">
            <p class="chat__empty" id="chat-empty">
              <svg class="chat__empty-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2.5 2.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6l-3.5 3v-3h-.5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linejoin="round"
                />
              </svg>
              아직 대화가 없습니다. Enter 키를 눌러 말을 걸어보세요.
            </p>
          </div>
          <label class="chat__label" for="chat-input">채팅 입력</label>
          <input
            id="chat-input"
            class="chat__input"
            type="text"
            autocomplete="off"
            placeholder="Enter 키로 입력, Esc 로 취소"
          />
        </div>

        <!--
          One top-right cluster: the controls row, and the minimap unfolding under it. Before
          #transition so the wipe, the notice and the boot overlay all draw over it. The wrapper
          is click-through; only the controls take pointer events, or its empty area would eat
          clicks meant for the world.
        -->
        <div class="hud">
          <div class="hud__controls">
            <button
              type="button"
              class="hud__button"
              id="home-button"
              aria-keyshortcuts="H Home"
              title="홈으로 (H)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M2.5 7.2 8 2.6l5.5 4.6M4 8.4v4.6h8V8.4M6.6 13v-3.1h2.8V13"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              홈으로
            </button>
            <button
              type="button"
              class="hud__button hud__button--square"
              id="minimap-button"
              aria-expanded="false"
              aria-controls="minimap"
              aria-keyshortcuts="M"
              title="미니맵 (M)"
              hidden
            >
              <svg class="hud__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M6 3 2.5 4.4v8.2L6 11.2m0-8.2 4 1.6m-4-1.6v8.2m4-6.6 3.5-1.4v8.2L10 11.2m0-8.2v8.2m-4 0 4 1.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="visually-hidden">미니맵</span>
            </button>
          </div>
          <div class="minimap" id="minimap" hidden>
            <canvas class="minimap__canvas" id="minimap-canvas" role="img" aria-label="미니맵"></canvas>
          </div>
        </div>

        <!--
          One panel for all three fixed object types; objectPanel.ts fills the body and the footer
          per kind, since only those two differ and two of them never open at once. Before
          #transition and #boot-status like the HUD, so the wipe and the boot overlay always draw
          over it — a dropped connection must not leave a quiz sitting above "연결이 끊어졌습니다".
        -->
        <div id="object-panel" class="object" hidden>
          <div
            class="object__panel"
            id="object-panel-dialog"
            role="dialog"
            aria-labelledby="object-panel-title"
            tabindex="-1"
          >
            <p class="object__kind" id="object-panel-kind"></p>
            <h2 class="object__title" id="object-panel-title"></h2>
            <div class="object__body" id="object-panel-body"></div>
            <div class="object__footer">
              <a
                class="object__open"
                id="object-panel-link"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >
                새 탭에서 열기
              </a>
              <button type="button" class="object__close" id="object-panel-close">닫기</button>
            </div>
          </div>
        </div>

        <!-- Before #boot-status so a boot error raised during the new room's load stays visible. -->
        <div id="transition" class="transition" data-state="clear" aria-hidden="true"></div>
        <p id="transition-notice" class="notice" role="status" aria-live="polite" hidden></p>

        <!-- Character select. Runs once, before the first join, and never comes back. -->
        <div id="avatar-picker" class="picker" hidden>
          <div
            class="picker__panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="avatar-picker-title"
          >
            <h1 class="picker__title" id="avatar-picker-title">캐릭터 고르기</h1>
            <p class="picker__hint">방향키로 고르고 Enter 키로 시작합니다.</p>
            <div
              class="picker__grid"
              id="avatar-picker-grid"
              role="radiogroup"
              aria-labelledby="avatar-picker-title"
            ></div>
            <button type="button" class="picker__start" id="avatar-picker-start">
              이 캐릭터로 시작
            </button>
          </div>
        </div>

        <div id="boot-status" class="boot" data-state="loading" role="status" aria-live="polite">
          <span class="boot__spinner" aria-hidden="true"></span>
          <p class="boot__title" data-boot-title>화면을 준비하는 중</p>
          <p class="boot__detail" data-boot-detail>잠시만 기다려 주세요.</p>
          <button type="button" class="boot__retry" data-boot-retry>다시 시도</button>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
