# KAD deployment descriptor (Coolify + Traefik + Keycloak SSO ForwardAuth).
#
# One deliberate omission, and it applies to every service below: no `environment:` block.
# KAD merges its injected variables in as a map, and a list left here survives the merge as
# integer keys, failing the build outright with "non-string key in services.app.environment".
# That is also why `db` declares an image and nothing else — KAD provisions the instance and
# injects DATABASE_URL along with the credentials, so writing POSTGRES_PASSWORD (or any other
# value) here would both hardcode a secret and break the merge.
#
# The filename must stay `docker-compose.yml`. When the buildpack is switched to Compose,
# Coolify defaults "Docker Compose Location" to `.yaml` — correct it to `.yml`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    restart: unless-stopped
    # The server runs its migrations at container start, before listen(). Without this gate
    # the first boot races initdb, the migration throws, and the app crash-loops while the
    # database is merely still starting up.
    depends_on:
      db:
        condition: service_healthy
    labels:
      kad.app_name: "ksc-metaverse"
      # Key names are fixed; only the values are editable. `owner` must not be listed.
      # On an AUTO_APPROVE service a missing `viewer` entry means every authenticated
      # user gets 403.
      kad.roles: "admin:관리자,viewer:인증된 모든 사용자"
      # This label on its own changes nothing: a KAD administrator has to register the
      # path in the platform env and the service has to be redeployed through KAD Portal
      # before /api/health answers without SSO. Until then even the health endpoint is
      # redirected to Keycloak from outside the cluster.
      # /api/diag/ws-auth is deliberately not listed — it has to stay behind SSO, or its
      # "did the gateway's auth headers arrive" answer means nothing.
      kad.public_paths: "/api/health"
    healthcheck:
      # /api/health always answers 200 (a 401/403 would read as "not signed in" and send
      # oauth2-proxy into a redirect loop), so the body is what decides here — `curl -f`
      # alone would call a degraded server healthy. 127.0.0.1 rather than localhost,
      # whose IPv6 resolution is what makes probes fail spuriously in this environment.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - zep-pgdata:/var/lib/postgresql/data
    healthcheck:
      # No `-U`: KAD picks the role name, so naming one here would be a guess. libpq answers
      # PQPING_OK as soon as the server accepts connections, whatever role is asked for, which
      # is exactly the question this probe needs answered. start_period covers initdb on the
      # first boot, when the volume is still empty.
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # Named, so a redeploy replaces the container without taking the inventory with it.
  zep-pgdata:
